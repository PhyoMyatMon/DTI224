<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Grade Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        .container{
            width:350px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
        }

        input,button{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
            color:blue;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Grade Calculator</h2>

<label>Student Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Score</label>
<input type="number" id="score" placeholder="Enter your score">

<button onclick="calculateGrade()">Submit</button>
<button onclick="history.back()">Back</button>

<p id="result"></p>

</div>

<script>

function calculateGrade(){

    let name=document.getElementById("name").value;
    let score=document.getElementById("score").value;

    if(name==""){
        alert("Please enter your name.");
        return;
    }

    if(score==""){
        alert("Please enter your score.");
        return;
    }

    score=parseInt(score);

    if(score<0 || score>100){
        alert("Score must be between 0 and 100.");
        return;
    }

    let grade;

    if(score>=80){
        grade="A";
    }
    else if(score>=70){
        grade="B";
    }
    else if(score>=60){
        grade="C";
    }
    else if(score>=50){
        grade="D";
    }
    else{
        grade="F";
    }

    document.getElementById("result").innerHTML=
    name + "'s Grade : " + grade;

}

</script>

</body>
</html>
