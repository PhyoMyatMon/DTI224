<!DOCTYPE html>
<html>
<head>
    <title>Distance from University</title>
</head>
<body>

    <h2>Distance from University</h2>

    <label>X Coordinate:</label>
    <input type="number" id="x"><br><br>

    <label>Y Coordinate:</label>
    <input type="number" id="y"><br><br>

    <button onclick="calculateDistance()">Calculate</button>
    <button onclick="goBack()">Back</button>

    <h3 id="result"></h3>

    <script>
        function calculateDistance() {
            let x = document.getElementById("x").value;
            let y = document.getElementById("y").value;

            // Validation
            if (x === "" || y === "") {
                alert("Please enter both X and Y coordinates.");
                return;
            }

            x = parseFloat(x);
            y = parseFloat(y);

            let distance = Math.sqrt((x * x) + (y * y));

            document.getElementById("result").innerHTML =
                "Distance = " + distance.toFixed(2);
        }

        function goBack() {
            history.back();
        }
    </script>

</body>
</html>
