<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Change Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input, button { padding: 8px; margin: 5px 0; }
        button { cursor: pointer; }
        #error { color: red; }
        #result { margin-top: 15px; line-height: 1.6; }
    </style>
</head>
<body>

<h2>Change Calculator</h2>

<label for="amount">Enter Amount:</label>
<input type="number" id="amount" min="0" step="1" placeholder="Enter amount">

<br>

<button onclick="calculateChange()">Calculate</button>
<button onclick="goBack()">Back</button>

<p id="error"></p>

<h3>Output</h3>
<div id="result"></div>

<script>
function calculateChange() {
    const input = document.getElementById("amount");
    let amount = Number(input.value);
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.innerHTML = "";
    result.innerHTML = "";

    // Validation
    if (input.value.trim() === "") {
        error.innerHTML = "Please enter an amount.";
        input.focus();
        return;
    }

    if (!Number.isFinite(amount) || amount < 0 || !Number.isInteger(amount)) {
        error.innerHTML = "Please enter a valid whole amount greater than or equal to 0.";
        input.focus();
        return;
    }

    const money = [1000, 500, 100, 50, 20, 10, 5, 2, 1];
    let output = "";

    for (let i = 0; i < money.length; i++) {
        const count = Math.floor(amount / money[i]);

        if (money[i] >= 20) {
            output += "$" + money[i] + " note : " + count + "<br>";
        } else {
            output += "$" + money[i] + " coin : " + count + "<br>";
        }

        amount = amount % money[i];
    }

    result.innerHTML = output;
}

function goBack() {
    window.history.back();
}
</script>

</body>
</html>
